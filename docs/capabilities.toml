state = "blocked"
summary = "Source enforces an export grant, derives project scope from the authenticated principal, retains disclosure-lifetime gates, and uses project-scoped/RLS queries over a fixed export inventory. The BFF aborts an over-limit stream instead of presenting partial data as complete. Approved-scope inventory completeness, deployment authorization, and auditability are not established."
limits = [
  "The repository's fixed inventory is not evidence that every record required by an approved business, legal, or regulatory scope is included.",
  "Source and focused tests do not establish deployment authorization review, export auditability, redaction, legal-hold, or export-retention controls.",
]
future_gates = [
  "Define and approve the target export inventory, scope-completeness semantics, redaction, retention, legal-hold, and audit requirements.",
  "Validate authorized, denied, cross-project, and disclosure-lifetime paths in the target deployment with accountable audit evidence.",
]
evidence_class = "source_and_focused_tests"
evidence = [
  "src/tracebed/api/admin.py",
  "src/tracebed/api/deps.py",
  "src/tracebed/edge/main.py",
  "tests/phase0/test_edge_bff.py",
