[[capability]]
id = "project-scoped-memory"
name = "Project-scoped memory and retrieval"
state = "implemented_unverified"
summary = "Repository, storage, and hot-path code contain project-scoped memory and retrieval mechanisms. An authorized retrieval hold writes its final selected result through one transaction, but that record does not prove host delivery or form a complete security audit sink."
limits = [
