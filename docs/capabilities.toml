  "Selected-for-response and HOLDOUT shadow-selection records are not evidence of prompt delivery, user exposure, or agent improvement.",
]
future_gates = [
  "Exercise tenant-isolation and authorization properties against a representative database and identity boundary.",
  "Complete independent security review of cross-project and administrative access paths.",
]
