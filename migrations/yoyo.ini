# yoyo.ini — read-only inspection only.
#
# The yoyo CLI must NOT be used for apply or rollback. Its native mutation
# path splits SQL, audit logging, and state marking across transactions and
# therefore bypasses Tracebed's one-backend atomic runner. Mutate only through
# ``python -m tracebed.stores.pg.migrate apply|rollback|rollback-all`` or the
# documented bootstrap rollback action. The 0011 SQL additionally requires a
# Tracebed runner GUC as an accidental-bypass guard; that receipt is not a
# security boundary against a database owner.
#
# The sole supported yoyo CLI use is read-only inspection:
#
#   yoyo list -c migrations/yoyo.ini --database "$TB_STORAGE__PG_DSN"
#
# `database` is deliberately omitted: deployment supplies it at invocation
# time with --database (or YOYO_DATABASE), never from a committed credential.

[DEFAULT]
sources = %(here)s
