# yoyo.ini — PHASE-0 Task 5/6 (docs/PHASE0-CONTRACT.md §1; DECISIONS D-034).
#
# CI, tests, and the phase0 gate runner do not read this file — they call
# tracebed.stores.pg.migrate.apply_migrations(dsn) / rollback_migrations(dsn)
# / current_revision(dsn) directly, passing TB_STORAGE__PG_DSN, so the exact
# same code path runs everywhere (contract §1 "migrate.py — thin yoyo runner
# wrapper usable from CI and tests").
#
# This file exists for interactive/manual use of the `yoyo` CLI against a
# local database, e.g.:
#
#   yoyo apply    -c migrations/yoyo.ini --database "$TB_STORAGE__PG_DSN"
#   yoyo rollback -c migrations/yoyo.ini --database "$TB_STORAGE__PG_DSN"
#   yoyo list     -c migrations/yoyo.ini --database "$TB_STORAGE__PG_DSN"
#
# `database` is deliberately NOT set here: a committed DSN — even a
# placeholder — reads as a checked-in credential, and the real value is
# always deployment-specific (docker/compose.yaml for local dev, the
# platform's secret store in production). `--database` on the command line
# (or the `YOYO_DATABASE` environment variable yoyo also honours) supplies it
# at invocation time instead.

[DEFAULT]
sources = %(here)s
