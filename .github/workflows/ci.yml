name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Required by the settings model; the pin's value is irrelevant to offline gates.
  TB_EMBEDDING__MODEL_VERSION: ci-pin
  TB_HOLDOUT_SALT: ci-salt

# Workflow tokens are read-only unless an individual release-only workflow grants more.
permissions:
  contents: read

jobs:
  # Gates that need no services. These run first and fast: the licence gate is CI step 1
  # because psycopg (LGPL-3.0-only) would have failed the original spec's permissive-only
  # allowlist, and finding that out after the dependency tree is settled is expensive.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: "0.11.21"
          checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
      - run: uv sync --locked --extra dev

      - name: CI step 1 — licence gate
        run: |
          .venv/bin/python scripts/license_check.py --self-test
          .venv/bin/python scripts/license_check.py

      - name: CI step 2 — raw-SQL containment
        run: |
          .venv/bin/python scripts/raw_sql_lint.py --self-test
          .venv/bin/python scripts/raw_sql_lint.py

      - name: CI step 2b — container-image policy (D-109)
        run: |
          .venv/bin/python scripts/image_check.py --self-test
          .venv/bin/python scripts/image_check.py

      - name: CI step 2c — dependency audit (hard rule 10 / D-104)
        run: .venv/bin/python scripts/license_check.py --dependency-audit

      - name: capability contract parity
        run: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python scripts/capability_check.py --check

      - name: CI step 3 — hot-path purity (invariant 1)
        run: |
          .venv/bin/python scripts/purity_check.py --self-test
          .venv/bin/python scripts/purity_check.py

      - name: ruff
        run: .venv/bin/ruff check src tests harness scripts

      - name: mypy --strict
        run: .venv/bin/mypy

      # THE WHOLE OFFLINE SUITE, not `-m phase0`. The prompt names six harnesses as running
      # on every commit and makes invariant 8 CI-blocking from Phase 3 on; a phase0-only
      # selector ran roughly one test in three and gated none of: the negative probes
      # (phase1), the render property tests (phase1), the red team (phase3), or the
      # guessed-reward drill. Compose-v1 is exercised separately because it
      # requires secret files and a closed network profile.
      - name: offline test suite (every phase)
        run: .venv/bin/pytest -m "not integration" -q

      # The harnesses that are scripts rather than pytest modules. Each runs offline against
      # in-memory doubles and exits non-zero on failure, so they gate here rather than only
      # being runnable by hand.
      - name: offline harnesses
        run: |
          .venv/bin/python harness/guessed_reward.py
          .venv/bin/python harness/failopen_drill.py
          .venv/bin/python harness/consolidation_regression.py
          .venv/bin/python harness/workflow_scope.py

      - name: build wheel/sdist and run isolated artifact smoke
        run: |
          uv build
          .venv/bin/python scripts/artifact_smoke.py dist/*.whl dist/*.tar.gz

  # The operator console. Split from `static` because it needs Node rather than Python,
  # and kept independent of `integration` because none of these gates touch the stack —
  # a Postgres outage must not be able to hide a broken dashboard build.
  #
  # Ordered the same way `static` is, and for the same reason: the licence gate runs
  # FIRST. A dependency tree is cheapest to reject before anything has been built on
  # top of it, and the npm tree is where an unvetted transitive licence actually
  # arrives — 343 packages resolve from three declared runtime dependencies.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # `ci`, not `install`: the gate below must judge the locked tree, not a tree npm
      # was free to re-resolve on the runner.
      - run: npm ci

      - name: dashboard step 1 — licence gate
        run: |
          node scripts/license_check.mjs --self-test
          node scripts/license_check.mjs

      - name: dashboard test command
        run: npm test

      - name: dashboard step 2 — typecheck
        run: npx tsc --noEmit

      - name: dashboard step 3 — lint
        run: npx eslint src

      # Runs `tsc --noEmit && vite build`. Kept after the standalone typecheck so a type
      # error is reported as a type error rather than as a build failure.
      - name: dashboard step 4 — build
        run: npm run build

  # Compose-v1 is the only supported live topology.  The acceptance harness
  # generates a unique project name and exact-mode secret source internally,
  # then removes only resources carrying its exact project label.
  compose-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: "0.11.21"
          checksum: "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
      - run: uv sync --locked --extra dev

      - name: Compose-v1 isolated full acceptance
        timeout-minutes: 30
        run: env -u TB_HOLDOUT_SALT uv run python scripts/compose_acceptance.py
