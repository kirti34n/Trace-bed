# Serves the built SPA and reverse-proxies the exact three path prefixes the
# real API exposes (routes_v1.py /v1/*, admin.py /admin/* and /export/*) —
# see docker/compose.yaml's `dashboard` service, which puts this container on
# the same compose network as `api` (service DNS name "api", port 8110, per
# PLAN.md §3's ports table). Anything else 404s at nginx rather than reaching
# a backend that has no route for it.
server {
    listen 8111;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routing (react-router-dom in App.tsx) owns
    # every path under this one; nginx's job is only to keep serving
    # index.html so a deep link / refresh doesn't 404 at the file server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://api:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://api:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /export/project streams NDJSON (contract §9.3) — buffering off so the
    # dashboard sees rows as psycopg's server-side cursor yields them instead
    # of nginx holding the whole body until the backend closes the response.
    location /export/ {
        proxy_pass http://api:8110;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://api:8110;
    }
}
