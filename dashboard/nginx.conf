# This file is included inside nginx's `http` context.  Rate-limit by the
# directly connected browser address; do not trust a spoofable forwarding
# header at this public ingress.
limit_req_zone $binary_remote_addr zone=tracebed_auth_login:10m rate=5r/s;

# Serves the SPA and the browser-only same-origin BFF.  The dashboard must not
# be an alternate ingress to API owner/admin/erasure surfaces: only the exact
# ordinary `/v1/*` paths below reach the edge, which alone talks to private API.
server {
    listen 8111;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    proxy_set_header Host $host;
    # This is overwritten at the only public ingress. Edge accepts it solely
    # when the direct socket peer is this fixed nginx container.
    proxy_set_header X-Tracebed-Client-Address $remote_addr;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "private, no-store" always;

    # SPA fallback: client-side routing (react-router-dom in App.tsx) owns
    # every path under this one; nginx's job is only to keep serving
    # index.html so a deep link / refresh doesn't 404 at the file server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /auth/login {
        limit_req zone=tracebed_auth_login burst=10 nodelay;
        proxy_pass http://edge:8120;
        proxy_http_version 1.1;
    }

    location = /auth/callback {
        proxy_pass http://edge:8120;
        proxy_http_version 1.1;
        access_log off;
    }

    location = /auth/csrf {
        proxy_pass http://edge:8120;
        proxy_http_version 1.1;
    }

    location = /auth/session {
        proxy_pass http://edge:8120;
        proxy_http_version 1.1;
    }

    location = /auth/demo-manifest {
        proxy_pass http://edge:8120;
        proxy_http_version 1.1;
    }

    location = /auth/logout {
        proxy_pass http://edge:8120;
        proxy_http_version 1.1;
    }

    location = /v1/retrieve { proxy_pass http://edge:8120; }
    location = /v1/trace { proxy_pass http://edge:8120; }
    location = /v1/trace/batch { proxy_pass http://edge:8120; }
    location = /v1/feedback { proxy_pass http://edge:8120; }
    location = /v1/propose_memory { proxy_pass http://edge:8120; }
    location = /v1/invalidation { proxy_pass http://edge:8120; }

    location = /admin/whoami { proxy_pass http://edge:8120; }
    location = /admin/memory { proxy_pass http://edge:8120; }
    location ~ "^/admin/memory/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" { proxy_pass http://edge:8120; }
    location = /admin/injections { proxy_pass http://edge:8120; }
    location = /admin/review_queue { proxy_pass http://edge:8120; }
    location = /admin/killswitch_state { proxy_pass http://edge:8120; }
    location = /admin/invalidations { proxy_pass http://edge:8120; }
    location = /admin/spend { proxy_pass http://edge:8120; }
    location = /admin/config { proxy_pass http://edge:8120; }
    location = /admin/lift/report { proxy_pass http://edge:8120; }
    location = /admin/staleness/report { proxy_pass http://edge:8120; }
    location = /admin/consolidation/diffs { proxy_pass http://edge:8120; }
    location = /export/project {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://edge:8120;
    }

    location /admin/ { return 404; }
    location /export/ { return 404; }
    location /v1/erasure-requests { return 404; }

    location = /healthz {
        proxy_pass http://edge:8120;
    }
}
